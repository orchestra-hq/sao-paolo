name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # release-please doesn't know about uv.lock, so `uv` bumps it (and pyproject.toml) itself.
  sync-uv-version:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - name: Read version from release-please manifest
        id: version
        run: echo "version=$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - name: Bump pyproject.toml and uv.lock via uv
        run: uv version "${{ steps.version.outputs.version }}"
      - name: Commit changes back to the release PR
        run: |
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: sync pyproject.toml and uv.lock to ${{ steps.version.outputs.version }}"
          git push origin HEAD:"${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}"

name: release-please

on:
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # release-please doesn't know about uv.lock, so `uv` bumps it (and pyproject.toml) itself.
  sync-uv-version:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Read version from release-please manifest
        id: version
        run: echo "version=$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Bump pyproject.toml and uv.lock via uv
        run: uv version "${{ steps.version.outputs.version }}"

      - name: Commit changes back to the release PR
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: sync pyproject.toml and uv.lock to ${{ steps.version.outputs.version }}"
          file_pattern: "pyproject.toml uv.lock"

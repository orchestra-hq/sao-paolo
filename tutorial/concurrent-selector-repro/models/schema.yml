version: 2

sources:
  - name: raw
    schema: "{{ target.schema }}_raw"
    database: "{{ target.database }}"
    tables:
      - name: raw_events
        identifier: raw_events
        # No `freshness:` block -- Orchestra forces SourceDefinition.has_freshness
        # so a loaded_at_query alone is enough to compute freshness for model_a.
        config:
          loaded_at_query: "select max(event_at) as event_at from {{ this }}"

  - name: raw_unused
    schema: "{{ target.schema }}_raw"
    database: "{{ target.database }}"
    description: >
      Nothing in this project selects stg_unused_page_views, so scoping should
      never check this source's freshness -- proves the unscoped/scoped test
      case in test_concurrent_selector_repro.py.
    tables:
      - name: raw_page_views
        identifier: raw_page_views

  - name: raw_orphan
    schema: "{{ target.schema }}_raw"
    database: "{{ target.database }}"
    description: >
      Unlike raw_unused (which stg_unused_page_views does reference), nothing
      in this project's models references this source at all. Also has a
      loaded_at_query and no `freshness:` block, same as raw.raw_events.
      Proves that scoping still excludes a source no model depends on even
      when the triggering command is a bare `dbt build` with no
      --select/--selector, which otherwise resolves to every model.
    tables:
      - name: orphan_events
        identifier: raw_events
        config:
          loaded_at_query: "select max(event_at) as event_at from {{ this }}"

models:
  # A: fed directly by the source. Selector X targets this node alone.
  - name: model_a
  # B: downstream of A only. No source of its own, no build_after config.
  - name: model_b
  # Deliberately not selected by anything in the tests -- see raw_unused above.
  - name: stg_unused_page_views

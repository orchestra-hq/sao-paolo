selectors:
  # Selector X: the narrow pipeline. Selects ONLY model_a (the source-fed node).
  - name: selector_x
    description: Narrow pipeline - model_a only.
    definition:
      method: fqn
      value: model_a

  # Selector Y: the full pipeline. Selects model_a and everything downstream (model_b).
  - name: selector_y
    description: Full pipeline - model_a and its downstream (model_b).
    definition:
      method: fqn
      value: model_a
      children: true

  # Selector Z: a union of two independent criteria (not a bare fqn, not
  # ancestor/descendant of one node) spanning both of the project's sources.
  - name: selector_z
    description: Union of model_a and stg_unused_page_views -- touches both sources.
    definition:
      union:
        - method: fqn
          value: model_a
        - method: fqn
          value: stg_unused_page_views

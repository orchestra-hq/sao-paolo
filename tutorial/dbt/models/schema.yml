version: 2

sources:
  - name: raw
    schema: "{{ target.schema }}_raw"
    database: "{{ target.database }}"
    tables:
      - name: raw_events
        identifier: raw_events
        config:
          freshness:
            warn_after: { count: 24, period: hour }
          loaded_at_field: event_at
          tags: [raw, freshness_test]
          # The seed data is long past warn_after, so this source is always stale. These
          # are the alert keys Orchestra reads off a node's meta: channel routes the
          # alert, owner is shown on it, team_owner is a Slack user or group ID to tag,
          # and each subscriber is also emailed. Left unset, team_owner and subscribers
          # tag and email no one.
          meta:
            channel: "{{ env_var('TUTORIAL_ALERT_CHANNEL', '#dbt-alerts-test') }}"
            owner: "{{ env_var('TUTORIAL_ALERT_OWNER', 'data-platform') }}"
            team_owner:
              - "{{ env_var('TUTORIAL_ALERT_TEAM_OWNER', '') }}"
            subscribers:
              - "{{ env_var('TUTORIAL_ALERT_SUBSCRIBER', '') }}"
      - name: raw_events_freshness_disabled
        identifier: raw_events
        description: "Same physical table as raw_events, but with freshness checking explicitly disabled to exercise Orchestra's `config.freshness: null` handling."
        config:
          freshness: null
          loaded_at_field: event_at

models:
  - name: stg_events
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - accepted_values:
              arguments:
                values: [999]
              config:
                severity: warn

  - name: int_events_enriched
    config:
      tags: [intermediate]

  - name: mart_daily_totals
    description: Daily aggregates used to demonstrate build_after with Orchestra state orchestration.
    config:
      tags: [mart]
      freshness:
        build_after:
          count: 5
          period: minute
          updates_on: all
    columns:
      - name: event_day
        tests:
          - not_null
